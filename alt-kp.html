.cbtn-outline{background:transparent;color:#ccc;border:1px solid #555}

.kp-page{background:#fff;padding:28px 34px;box-shadow:0 2px 16px rgba(0,0,0,.15);margin-bottom:28px}

/* ─── Template 1 ─── */
.t1-head-top{display:flex;justify-content:space-between;align-items:flex-start}
.t1-type{font-size:11px;color:#555;margin-bottom:1px}
.t1-name{font-size:20px;font-weight:900;color:#1a237e;line-height:1.1}
.t1-addr{font-size:10px;color:#555;text-align:right;line-height:1.7}

.t1-title{text-align:center;margin:16px 0 12px;font-style:italic;font-weight:bold;font-size:13px}
.t1-section{font-weight:bold;text-decoration:underline;margin-bottom:6px;font-size:13px}
.t1-tbl{width:100%;border-collapse:collapse;border:1px solid #000;font-size:11.5px}
.t1-tbl th,.t1-tbl td{border:1px solid #000;padding:5px 7px;vertical-align:top}
.t1-tbl th{color:#c62828;text-decoration:underline;font-size:11px;text-align:center;font-weight:bold;background:#fafafa}
.t1-tbl td{vertical-align:middle}
.t1-total td{background:#3949ab;color:#fff;font-weight:bold;font-size:11.5px}
.t1-footer td{font-size:11.5px}
.t1-sign{margin-top:26px;display:flex;align-items:flex-end;gap:16px}

/* ─── Template 2 ─── */
.t2-req{font-size:9px;color:#111;line-height:1.55;margin-bottom:14px;border-bottom:1px solid #000;padding-bottom:10px}
.t2-title{text-align:center;margin:14px 0 5px;font-weight:bold;font-size:14px;line-height:1.4}
.t2-from{text-align:center;margin-bottom:12px;font-weight:bold;font-size:12px}
.t2-intro{font-size:12px;line-height:1.65;margin-bottom:12px;text-indent:24px}
.t2-tbl{width:100%;border-collapse:collapse;border:1px solid #000;font-size:12px;margin-bottom:10px}
.t2-tbl th{border:1px solid #000;padding:7px 8px;background:#f0f0f0;font-weight:bold;text-align:center;vertical-align:middle}
.t2-tbl td{border:1px solid #000;padding:6px 8px;vertical-align:middle}
.t2-tbl .t2-num{text-align:center;width:32px}
.t2-tbl .t2-qty{text-align:center;width:50px}
.t2-tbl .t2-price{text-align:right;width:90px}
.t2-tbl .t2-sum{text-align:right;width:100px;font-weight:600}
.t2-tbl .t2-sub td{color:#555;font-size:11px}
.t2-tbl .t2-bold td{font-weight:bold}
.t2-note{font-size:11.5px;line-height:1.65;margin-top:8px;text-indent:24px;color:#222}
.t2-sign{margin-top:22px}
.sig-cursive{font-family:'Dancing Script',cursive;font-size:30px;color:#1a1a8c;display:inline-block;transform:rotate(-4deg);line-height:1}

@media print{
  @page{margin:0}
  body{background:#fff}
  #controls{display:none!important}
  .kp-wrapper{margin:0;padding:0;max-width:100%}
  .kp-page{box-shadow:none;margin-bottom:0;padding:12mm 10mm}
  .kp-page.hidden{display:none!important}
  body.print-kp1 #kp2{display:none!important}
  body.print-kp2 #kp1{display:none!important}
  body.print-both #kp1{page-break-after:always}
  body.print-both #kp2{display:block!important}
}

function ap(price,m){return Math.ceil(price*(1+m/100)/100)*100;}
function fmt(n){return Number(n).toLocaleString('ru-RU');}
function ruDate(){
  var d=new Date();
  var mo=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear()+' г.';
}
function altNums(entry){
  var id=Math.abs(entry.id||Date.now())%100000;
  var n1=(id%4999)+5000;
  var n2a=String(((Math.floor(id/7))%9000)+1000);
  var n2b=String(((Math.floor(id/13))%9000)+1000);
  return{kp1:String(n1),kp2:n2a+'-'+n2b};
}
function notInclList(entry){
  var c=entry.client||{},list=[];
  if(!c.inclDelivery)list.push('доставка');
  if(!c.inclMontage)list.push('монтаж и пуско-наладка');
  if(!c.inclObvyazka)list.push('монтаж трубопроводной обвязки');
  return list;
}
function svcItems(entry,m){
  var c=entry.client||{},r=[];
  var bmz=(entry.items||[]).some(function(i){return i.category==='Блочно-модульные здания';});
  var s=bmz?' (внутри БМЗ)':'';
  if(c.inclDelivery&&c.priceDelivery>0)r.push({n:c.svcNameDelivery||'Транспортные услуги',p:ap(c.priceDelivery,m)});
  if(c.inclMontage&&c.priceMontage>0)r.push({n:(c.svcNameMontage||('Монтаж и пуско-наладка оборудования'+s)),p:ap(c.priceMontage,m)});
  if(c.inclObvyazka&&c.priceObvyazka>0)r.push({n:(c.svcNameObvyazka||('Монтаж трубопроводной обвязки'+s)),p:ap(c.priceObvyazka,m)});
  if(c.inclVyezd&&c.priceVyezd>0)r.push({n:c.svcNameVyezd||'Выезд технического специалиста',p:ap(c.priceVyezd,m)});
  if(c.inclKomandirovka&&c.priceKomandirovka>0)r.push({n:c.svcNameKomandirovka||'Командировочные расходы',p:ap(c.priceKomandirovka,m)});
  return r;
}
function calcTotal(entry,m){
  var items=entry.items||[];
  var svcs=svcItems(entry,m);
  var eq=items.reduce(function(a,it){return a+ap(it.customPrice,m)*it.quantity;},0);
  var sv=svcs.reduce(function(a,s){return a+s.p;},0);
  return Math.round((eq+sv)*(1-(entry.discount||0)/100));
}

    +'<div class="t2-intro">Изучив направленный Вами запрос исх., о предоставлении ценовой информации, мы, нижеподписавшиеся, предлагаем осуществить поставку товара: технологическое оборудование для водоподготовки.<br>На условиях, указанных в запросе, на общую сумму '+fmt(total)+' рублей, подтвержденную прилагаемой таблицей, в которой указана цена единицы товара и расчетом:</div>'
    +'<table class="t2-tbl"><thead><tr><th class="t2-num">№</th><th>Наименование оборудования</th><th class="t2-qty">Кол-во, шт.</th><th class="t2-price">Цена, руб.</th><th class="t2-price">Сумма, руб.</th></tr></thead>'
    +'<tbody>'+tableRows+'</tbody>'
    +'</table>'
    +'<div style="font-size:12px;margin:6px 0"><strong>Срок поставки оборудования</strong><br>'+dd+' дней</div>'
    +'<div style="font-size:12px;margin:4px 0"><strong>Срок гарантии на товар:</strong><br>12 месяцев</div>'
    +((entry.client||{}).inclDelivery&&!((entry.client||{}).priceDelivery>0)?'<div class="t2-note">Стоимость услуг по доставке товара до фактического адреса «Заказчика» включена в указанную выше общую стоимость данного коммерческого предложения.</div>':'')
    +(notInclList(entry).length?'<div class="t2-note" style="color:#555">В стоимость не входит: '+notInclList(entry).join(', ')+'.</div>':'')
    +'<div class="t2-note">Мы признаём, что направление заказчиком запроса на предоставление ценовой информации и представление участником коммерческого предложения не накладывает на стороны никаких обязательств до момента заключения контракта.</div>'
    +'<div class="t2-sign">'
    +'<div style="margin-bottom:8px;font-size:13px">С уважением директор Потапенко И.А.</div>'
    +'<img src="images/potapenko.png" style="height:130px;display:block">'
    +'</div>';
}

/* ─── Render & Controls ──────────────────────────────────────── */
function renderAll(){
  var m1=+(document.getElementById('altM1').value||20);
  var m2=+(document.getElementById('altM2').value||35);
  var dd=document.getElementById('deliveryDays').value||'15';
  if(!kpData){
    document.getElementById('kp1').innerHTML='<p style="padding:40px;text-align:center;color:#c62828;font-size:14px">Данные КП не найдены.<br>Откройте эту страницу из конструктора КП.</p>';
    document.getElementById('kp2').innerHTML='';
    return;
  }
  document.getElementById('kp1').innerHTML=renderKP1(kpData,m1,dd);
  document.getElementById('kp2').innerHTML=renderKP2(kpData,m2,dd);
}
function rerender(){renderAll();}

function switchTab(n){
  activeTab=n;
  document.getElementById('kp1').classList.toggle('hidden',n===2);
  document.getElementById('kp2').classList.toggle('hidden',n===1);
  document.getElementById('tab1').classList.toggle('active',n===1);
  document.getElementById('tab2').classList.toggle('active',n===2);
  document.getElementById('tab0').classList.toggle('active',n===0);
}

function printKP(n){
  document.getElementById('kp1').classList.remove('hidden');
  document.getElementById('kp2').classList.remove('hidden');
  document.body.classList.remove('print-kp1','print-kp2','print-both');
  if(n===1)document.body.classList.add('print-kp1');
  else if(n===2)document.body.classList.add('print-kp2');
  else document.body.classList.add('print-both');
  var old=document.title;
  document.title=n===1?'КП (Юниорспецснаб)':n===2?'КП (Потапенко)':'КП (Юниорспецснаб + Потапенко)';
  window.print();
  window.onafterprint=function(){
    document.title=old;
    document.body.classList.remove('print-kp1','print-kp2','print-both');
    switchTab(activeTab);
  };
}

/* ─── Load ───────────────────────────────────────────────────── */
var kpId=params.get('kpId');
var shareToken=params.get('t');
document.getElementById('altM1').value=+(params.get('m1')||20);
document.getElementById('altM2').value=+(params.get('m2')||35);

if(kpId){
  try{var h=JSON.parse(localStorage.getItem('kp_history')||'[]');kpData=h.find(function(e){return String(e.id)===String(kpId);})||null;}catch(e){kpData=null;}
  renderAll();
}else if(shareToken){
  document.getElementById('kp1').innerHTML='<p style="padding:40px;text-align:center;color:#666">Загрузка из облака…</p>';
  fetch(SUPA_URL+'/rest/v1/kps?share_token=eq.'+encodeURIComponent(shareToken)+'&select=data',{
    headers:{'apikey':ANON,'Authorization':'Bearer '+ANON}
  }).then(function(r){return r.json();}).then(function(rows){
    if(rows&&rows[0]&&rows[0].data)kpData=rows[0].data;
    renderAll();
  }).catch(function(){renderAll();});
}else{
  renderAll();
}
</script>
</body>
</html>
