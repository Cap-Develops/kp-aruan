<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Коммерческое предложение — Аруан & Аурус</title>
<style>
@font-face{font-family:'Muller';src:url('fonts/muller-regular.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:'Muller';src:url('fonts/muller-medium.woff2') format('woff2');font-display:swap;font-weight:500}
@font-face{font-family:'Muller';src:url('fonts/muller-bold.woff2') format('woff2');font-display:swap;font-weight:700}
@font-face{font-family:'Muller';src:url('fonts/muller-extrabold.woff2') format('woff2');font-display:swap;font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Muller',Arial,sans-serif;background:linear-gradient(180deg,#EEF2F7 0%,#E1E8F0 100%);color:#1a2332;min-height:100vh}
:root{--blue:#1565C0;--blue-dark:#0D47A1;--accent:#FF6F00;--muted:#64748b;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);--radius:14px}
/* Topbar */
.topbar{background:#1a2332;padding:10px 24px;display:flex;align-items:center;gap:10px}
.topbar-logos{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-logos a{width:36px;height:36px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.topbar-logos img{width:30px;height:30px;object-fit:contain}
.topbar-title{color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.topbar-sub{color:rgba(255,255,255,.5);font-size:12px;white-space:nowrap}
.topbar-contacts{margin-left:auto;display:flex;gap:20px;flex-shrink:0;align-items:center}
.topbar-contacts a{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);text-decoration:none;white-space:nowrap;transition:color .2s}
.topbar-contacts a:hover{color:#fff}
.topbar-contacts svg{flex-shrink:0;opacity:.85}
@media(max-width:700px){.topbar{flex-wrap:wrap;gap:6px}.topbar-contacts{margin-left:0;gap:12px}}
@media(max-width:480px){.topbar-contacts a span{display:none}}
/* Layout */
.container{max-width:960px;margin:32px auto;padding:0 16px 48px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
/* Preview header */
.preview-header{background:linear-gradient(135deg,#0a3d8f,#1565C0,#42A5F5);padding:32px 36px;color:#fff}
.preview-table{width:100%;border-collapse:collapse}
.preview-table th{padding:11px 10px;color:#fff;font-size:12px;font-weight:700;text-align:left;background:linear-gradient(135deg,#0D47A1,#1565C0)}
.preview-table td{padding:11px 10px;font-size:13px;border-bottom:1px solid #E8EDF2;vertical-align:middle}
.preview-table tr:hover td{background:#FAFCFF}
/* Manager & Client blocks */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 36px;background:#F8FAFD;border-bottom:1px solid var(--border)}
@media(max-width:600px){.info-grid{grid-template-columns:1fr;padding:16px}}
.info-block{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid var(--border)}
.info-block-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.mgr-row{display:flex;align-items:center;gap:12px}
.mgr-photo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #E3F2FD;flex-shrink:0}
.mgr-photo-placeholder{width:48px;height:48px;border-radius:50%;background:#E3F2FD;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mgr-name{font-size:13px;font-weight:700;line-height:1.3}
.mgr-detail{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.client-name{font-size:14px;font-weight:700;margin-bottom:4px}
.client-detail{font-size:12px;color:var(--muted);line-height:1.8}
/* Stats bar */
.stats-bar{display:flex;background:#F5F5F5;padding:12px 36px;gap:24px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
@media(max-width:600px){.stats-bar{padding:12px 16px}}
/* Table wrapper */
.table-wrap{padding:0 36px 24px;overflow-x:auto}
@media(max-width:600px){.table-wrap{padding:0 12px 20px}}
/* Totals */
.totals-wrap{display:flex;justify-content:flex-end;margin-top:16px}
.totals-box{background:#F5F5F5;border-radius:8px;padding:16px 24px;min-width:280px}
/* Footer note */
.footer-note{margin:16px 0 0;padding:14px 18px;background:#E8F5E9;border-radius:8px;font-size:13px;color:#1B5E20;line-height:1.6}
/* Actions */
.actions{display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap}
.btn-pdf{padding:13px 36px;border-radius:10px;border:none;background:linear-gradient(135deg,#FF6F00,#FFA000);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(255,111,0,.3)}
.btn-back{padding:13px 28px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-size:14px;font-weight:600;color:#1a2332;text-decoration:none;display:inline-block}
/* States */
.loader{text-align:center;padding:80px;color:var(--muted);font-size:16px}
.error-box{text-align:center;padding:60px;color:#C62828}
.error-box h2{margin-bottom:8px}
/* Spec dots */
.spec-line{display:flex;gap:5px;align-items:baseline;font-size:11px;line-height:1.5;margin-bottom:1px}
.spec-dot{color:var(--blue);flex-shrink:0}
.spec-text{flex:1}
/* Accordion */
.accordion{margin-top:16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.acc-item{background:#fff;border-bottom:1px solid var(--border)}
.acc-item:last-child{border-bottom:none}
.acc-trigger{width:100%;padding:16px 24px;display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:#1a2332;text-align:left;transition:background .15s}
.acc-trigger:hover{background:#F8FAFD}
.acc-icon{flex-shrink:0;color:var(--blue)}
.acc-arrow{margin-left:auto;font-size:12px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.acc-trigger.open .acc-arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 24px 24px}
.acc-body.open{display:block}
/* Requisites table */
.req-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.req-table td{padding:8px 12px;border-bottom:1px solid #F0F4F8}
.req-table tr:last-child td{border-bottom:none}
.req-table td:first-child{font-weight:700;color:var(--blue);width:45%;white-space:nowrap}
/* Cert thumbnails */
.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.cert-card{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:12px;padding:8px 8px 0;box-shadow:0 2px 12px rgba(21,101,192,.10),0 0 0 1.5px rgba(21,101,192,.18);cursor:zoom-in;transition:transform .22s,box-shadow .22s;position:relative;overflow:hidden}
.cert-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1565C0,#2979d6,#42a5f5)}
.cert-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 8px 28px rgba(21,101,192,.22),0 0 0 2px #1565C0}
.cert-thumb{height:190px;object-fit:contain;display:block;border-radius:4px}
.cert-label{font-size:10px;color:#90a4ae;padding:6px 4px 8px;font-weight:500;letter-spacing:.3px}
/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox-img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox-close{position:fixed;top:20px;right:28px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;line-height:1;opacity:.8}
.lightbox-close:hover{opacity:1}
.lightbox-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;cursor:pointer;padding:12px 16px;border-radius:8px;backdrop-filter:blur(4px);transition:background .2s}
.lightbox-nav:hover{background:rgba(255,255,255,.25)}
.lightbox-prev{left:16px}
.lightbox-next{right:16px}
@media print{.topbar,.actions,.accordion,.lightbox{display:none!important}.container{margin:0;padding:0}.card{box-shadow:none;border-radius:0}}
</style>
</head>

<script>
function plRu(n,one,few,many){var a=Math.abs(n)%100,b=a%10;if(a>=11&&a<=19)return many;if(b===1)return one;if(b>=2&&b<=4)return few;return many;}
function _resolveImg(item){
  if(typeof EQUIPMENT_DB!=='undefined'){
    var db=EQUIPMENT_DB.find(function(x){return x.id==item.id;});
    if(db&&db.img)return db.img;
  }
  return item.img||'';
}
function _imgurl(v){return v?(String(v).slice(0,5)==='data:'?v:'images/'+v):'';}

var MANAGERS=[
  {id:0,name:'',phone:'',ext:'',email:'',photo:''},
  {id:1,name:'Кривошеев Сергей Сергеевич',phone:'8-800-100-39-54',ext:'10',email:'prom10@aruan.ru',photo:'assets/manager_1.png'},
  {id:2,name:'Маякова Лилия Анатольевна',phone:'8-800-100-39-54',ext:'13',email:'prom13@aruan.ru',photo:'assets/manager_2.png'},
  {id:3,name:'Мещерякова Анжелика Владимировна',phone:'8-800-100-39-54',ext:'105',email:'',photo:'assets/manager_3.png'},
  {id:4,name:'Щукин Игорь Александрович',phone:'8-800-100-39-54',ext:'100',email:'sale100@aruan.ru',photo:'assets/manager_4.png'},
  {id:5,name:'Войтович Станислав Владимирович',phone:'8-800-100-39-54',ext:'20',email:'prom20@aruan.ru',photo:'assets/manager_5.png'},
  {id:6,name:'Маяков Дмитрий Анатольевич',phone:'8-800-100-39-54',ext:'14',email:'prom14@aruan.ru',photo:'assets/manager_6.png'}
];

var SB_URL='https://newproject-sb.netlify.app';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjbHp5enp0b3JpcHVscGNwc2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODIyNzMsImV4cCI6MjA5MjM1ODI3M30.rX-WT1WdZiwRakVcUEkcg-_dnWzfU49LvgTNHYgBYQ0';
var SB_HEADERS={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

function sbFetch(path,opts){return fetch(SB_URL+path,Object.assign({headers:SB_HEADERS},opts));}

function fmt(n){return Number(n).toLocaleString('ru-RU');}
function fmtSpecs(s){
  if(!s)return '';
  var p=s.split(/\.\s+/).filter(function(x){return x.trim();});
  if(p.length<=1)return '<span style="font-size:11px;color:var(--muted)">'+s+'</span>';
  return p.map(function(x){return '<div class="spec-line"><span class="spec-dot">·</span><span class="spec-text">'+x.replace(/\.$/,'')+'</span></div>';}).join('');
}
function getManager(id){return MANAGERS.find(function(m){return m.id===id;})||MANAGERS[0];}

async function fetchFromCloud(token){
  var r=await sbFetch('/rest/v1/kps?share_token=eq.'+encodeURIComponent(token)+'&select=data,view_count');
  if(!r.ok)return null;
  var arr=await r.json();
  return arr&&arr[0]?arr[0]:null;
}

function trackView(token,currentCount){
  sbFetch('/rest/v1/kps?share_token=eq.'+encodeURIComponent(token),{
    method:'PATCH',
    body:JSON.stringify({view_count:(currentCount||0)+1,last_viewed_at:new Date().toISOString()})
  }).catch(function(){});
}

async function load(){
  var token=new URLSearchParams(location.search).get('t');
  if(!token){showError('Ссылка недействительна','Токен не указан.');return;}

  var cacheKey='kp_view_'+token;
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem(cacheKey));}catch(e){}

  var isManager=!!(+localStorage.getItem('my_manager_id')||0);

  if(cached&&cached.data){
    render(cached.data);
    fetchFromCloud(token).then(function(row){
      if(row){
        localStorage.setItem(cacheKey,JSON.stringify({data:row.data,ts:Date.now()}));
        if(!isManager)trackView(token,row.view_count);
      }
    });
  } else {
    var row=await fetchFromCloud(token);
    if(!row){showError('КП не найдено','Возможно, ссылка устарела или была удалена.');return;}
    localStorage.setItem(cacheKey,JSON.stringify({data:row.data,ts:Date.now()}));
    render(row.data);
    if(!isManager)trackView(token,row.view_count);
  }
}

function getServiceItems(kp){
  var c=kp.client||{};var r=[];
  if(c.inclDelivery&&c.priceDelivery>0)r.push({name:c.svcNameDelivery||'Доставка',price:c.priceDelivery});
  if(c.inclMontage&&c.priceMontage>0)r.push({name:c.svcNameMontage||'Монтаж',price:c.priceMontage});
  if(c.inclObvyazka&&c.priceObvyazka>0)r.push({name:c.svcNameObvyazka||'Обвязка',price:c.priceObvyazka});
  if(c.inclVyezd&&c.priceVyezd>0)r.push({name:c.svcNameVyezd||'Выезд специалистов',price:c.priceVyezd});
  if(c.inclKomandirovka&&c.priceKomandirovka>0)r.push({name:c.svcNameKomandirovka||'Командировочные',price:c.priceKomandirovka});
  return r;
}
function getServicesTotal(kp){return getServiceItems(kp).reduce(function(a,i){return a+i.price;},0);}

function render(kp){
  var client=kp.client||{};
  var items=kp.items||[];
  var discount=kp.discount||0;
  var total=kp.total||0;
  var svcItems=getServiceItems(kp);
  var eqSub=items.reduce(function(a,i){return a+i.customPrice*i.quantity;},0);
  var svcTotal=getServicesTotal(kp);
  var subtotal=eqSub+svcTotal;
  var discAmt=subtotal*(discount/100);
  var mgr=getManager(client.managerId||0);
  var dateFmt=new Date(client.kpDate||kp.savedAt).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});

  var html='<div class="card">';

  // ── Header ──
  html+='<div class="preview-header">';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px">';
  html+='<div>';
  html+='<div style="font-size:11px;font-weight:600;opacity:.7;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Коммерческое предложение</div>';
  html+='<div style="font-size:28px;font-weight:800">№ '+(client.kpNum||'—')+'</div>';
  html+='<div style="margin-top:8px;font-size:13px;opacity:.8">от '+dateFmt+'</div>';
  html+='</div>';
  html+='<div style="text-align:right">';
  html+='<div style="font-size:20px;font-weight:800">АРУАН & АУРУС</div>';
  html+='<div style="font-size:11px;opacity:.7;margin-top:4px">ООО «Техноинтеллект»</div>';
  html+='<div style="font-size:12px;margin-top:2px">8-800-100-39-54</div>';
  html+='</div></div></div>';

  // ── Manager + Client blocks ──
  var hasManager=mgr&&mgr.id>0;
  var hasClient=client.name||client.contact||client.phone||client.email;
  if(hasManager||hasClient){
    html+='<div class="info-grid">';
    // Manager
    if(hasManager){
      html+='<div class="info-block">';
      html+='<div class="info-block-title">Ваш менеджер</div>';
      html+='<div class="mgr-row">';
      html+='<img class="mgr-photo" src="'+mgr.photo+'" alt="'+mgr.name+'" onerror="this.style.display=\'none\'">';
      html+='<div>';
      html+='<div class="mgr-name">'+mgr.name+'</div>';
      html+='<div class="mgr-detail">';
      html+=mgr.phone?'📞 '+mgr.phone+(mgr.ext?' доб. '+mgr.ext:'')+'<br>':'';
      html+=mgr.email?'✉ '+mgr.email:'';
      html+='</div></div></div></div>';
    } else {
      html+='<div></div>';
    }
    // Client
    if(hasClient){
      html+='<div class="info-block">';
      html+='<div class="info-block-title">Клиент</div>';
      if(client.name)html+='<div class="client-name">'+client.name+'</div>';
      html+='<div class="client-detail">';
      if(client.contact)html+=client.contact+'<br>';
      if(client.phone)html+='📞 '+client.phone+'<br>';
      if(client.email)html+='✉ '+client.email;
      html+='</div></div>';
    }
    html+='</div>';
  }

  // ── Stats bar ──
  html+='<div class="stats-bar">';
  html+='<div><span style="font-size:11px;color:var(--muted)">Позиций:</span> <strong>'+(items.length+svcItems.length)+'</strong></div>';
  html+='<div style="margin-left:auto"><span style="font-size:11px;color:var(--muted)">Итого (вкл. НДС 22%):</span> <strong style="font-size:18px;color:var(--blue)">'+fmt(total)+' ₽</strong></div>';
  html+='</div>';

  // ── Table ──
  html+='<div class="table-wrap"><table class="preview-table"><thead><tr>';
  html+='<th style="width:36px">№</th><th style="width:64px">Фото</th><th>Наименование</th><th>Характеристики</th>';
  html+='<th style="width:52px;text-align:center">Кол</th><th style="width:46px;text-align:center">Ед.</th>';
  html+='<th style="width:95px;text-align:right">Цена, ₽</th><th style="width:105px;text-align:right">Сумма, ₽</th>';
  html+='</tr></thead><tbody>';

  items.forEach(function(it,i){
    var fl='';
    if(it.fillType&&typeof COLUMN_FILLS!=='undefined'&&!it.name.includes('с засыпкой')){
      var ff=COLUMN_FILLS[it.fillType].find(function(f){return f.id===it.fillId;});
      if(ff)fl=' с засыпкой '+ff.name;
    }
    html+='<tr>';
    html+='<td style="text-align:center;font-weight:700;color:var(--blue)">'+(i+1)+'</td>';
    html+='<td style="text-align:center">'+(_resolveImg(it)?'<img src="'+_imgurl(_resolveImg(it))+'" style="width:56px;height:56px;object-fit:contain">':'')+'</td>';
    html+='<td style="font-weight:600">'+it.name+fl+'</td>';
    html+='<td>'+fmtSpecs(it.specs)+'</td>';
    html+='<td style="text-align:center;font-weight:600">'+it.quantity+'</td>';
    html+='<td style="text-align:center">'+it.unit+'</td>';
    html+='<td style="text-align:right">'+fmt(it.customPrice)+'</td>';
    html+='<td style="text-align:right;font-weight:700">'+fmt(it.customPrice*it.quantity)+'</td>';
    html+='</tr>';
  });

  svcItems.forEach(function(svc,si){
    html+='<tr style="background:#FFF8E1">';
    html+='<td style="text-align:center;font-weight:700;color:var(--accent)">'+(items.length+si+1)+'</td>';
    html+='<td></td><td style="font-weight:600">'+svc.name+'</td>';

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightboxBg(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="shiftLightbox(-1)">&#8249;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="shiftLightbox(1)">&#8250;</button>
</div>
<script>
var _lbImgs=['assets/cert_1.jpg','assets/cert_2.jpg','assets/cert_3.jpg','assets/cert_4.jpg'];
var _lbIdx=0;
function openLightbox(i){_lbIdx=i;document.getElementById('lightboxImg').src=_lbImgs[i];document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
function closeLightboxBg(e){if(e.target===document.getElementById('lightbox'))closeLightbox();}
function shiftLightbox(dir){_lbIdx=(_lbIdx+dir+_lbImgs.length)%_lbImgs.length;document.getElementById('lightboxImg').src=_lbImgs[_lbIdx];}
document.addEventListener('keydown',function(e){if(!document.getElementById('lightbox').classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')shiftLightbox(-1);if(e.key==='ArrowRight')shiftLightbox(1);});
</script>
