<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прайс-лист оборудования Аруан &amp; Аурус</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 14px;
      color: #1a2332;
      background: #f0f4f8;
    }

    /* ===== SCREEN HEADER ===== */
    .screen-header {
      background: #1a2332;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .screen-header .logos {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .screen-header img {
      height: 36px;
      object-fit: contain;
    }
    .screen-header .title {
      flex: 1;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .btn-print {
      background: #0D47A1;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-print:hover { background: #1565C0; }

    /* ===== FILTERS ===== */
    .filter-bar {
      padding: 14px 32px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      position: sticky;
      top: 69px;
      z-index: 99;
    }
    .chip {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid #CBD5E1;
      background: #fff;
      color: #475569;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .chip:hover { border-color: #0D47A1; color: #0D47A1; }
    .chip.active {
      background: #0D47A1;
      color: #fff;
      border-color: #0D47A1;
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      padding: 24px 32px;
    }

    /* ===== TABLE ===== */
    .price-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .price-table thead th {
      background: #0D47A1;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      padding: 12px 14px;
      text-align: left;
      letter-spacing: 0.03em;
    }
    .price-table thead th:last-child { text-align: right; }
    .price-table tbody tr:nth-child(even) { background: #F8FAFC; }
    .price-table tbody tr:nth-child(odd) { background: #fff; }
    .price-table tbody tr { transition: background 0.1s; }
    .price-table tbody tr:hover { background: #EFF6FF; }
    .price-table td {
      padding: 10px 14px;
      vertical-align: middle;
      border-bottom: 1px solid #E2E8F0;
    }
    .price-table tbody tr:last-child td { border-bottom: none; }

    /* Photo cell */
    td.col-photo {
      width: 100px;
      text-align: center;
    }
    .item-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 4px;
    }
    .img-placeholder {
      width: 80px;
      height: 80px;
      background: #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 24px;
      margin: 0 auto;
    }

    /* Name cell */
    td.col-name { width: 28%; }
    .item-name { font-weight: 600; color: #1a2332; line-height: 1.4; }
    .item-category {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      color: #64748B;
      background: #F1F5F9;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Specs cell */
    td.col-specs { color: #475569; font-size: 12.5px; line-height: 1.5; }

    /* Price cell */
    td.col-price {
      text-align: right;
      white-space: nowrap;
      font-weight: 700;
      font-size: 15px;
      color: #0D47A1;
      width: 140px;
    }

    /* ===== PRINT HEADER (hidden on screen) ===== */
    .print-header { display: none; }

    /* ===== PRINT STYLES ===== */
    @media print {
      body { background: #fff; font-size: 11px; }

      .screen-header,
      .filter-bar,
      .btn-print { display: none !important; }

      .content { padding: 0; }

      .print-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, #0D47A1 0%, #1565C0 50%, #0D47A1 100%);
        color: #fff;
        padding: 14px 24px;
        margin-bottom: 12px;
        break-inside: avoid;
      }
      .print-header .ph-logos {
        background: #fff;
        padding: 6px 14px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .print-header .ph-logos img { height: 28px; object-fit: contain; }
      .print-header .ph-title {
        text-align: right;
      }
      .print-header .ph-title h1 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .print-header .ph-title p {
        font-size: 12px;
        opacity: 0.85;
      }

      .price-table {
        box-shadow: none;
        border-radius: 0;
        width: 100%;
      }
      .price-table thead th {
        background: #0D47A1 !important;
        color: #fff !important;
        font-size: 10px;
        padding: 7px 8px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .price-table thead th:last-child { text-align: right; }
      .price-table tbody tr { break-inside: avoid; }
      .price-table tbody tr:nth-child(even) {
        background: #F8FAFC !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .price-table td {
        padding: 5px 8px;
        font-size: 11px;
      }
      td.col-photo { width: 26mm; }
      .item-img {
        width: 20mm;
        height: 20mm;
      }
      .img-placeholder {
        width: 20mm;
        height: 20mm;
        font-size: 14px;
      }
      td.col-price {
        font-size: 11px;
        width: 28mm;
      }

      /* Page number footer */
      @page {
        margin: 15mm 12mm 20mm 12mm;
        @bottom-center {
          content: "Стр. " counter(page) " из " counter(pages);
          font-size: 9px;
          color: #666;
        }
      }
    }
  </style>
<script src="supabase.min.js"></script>
<script src="auth.js"></script>
</head>
<body>

  <!-- SCREEN HEADER -->
  <header class="screen-header">
    <div class="logos">
      <img src="assets/logo_aruan.png" alt="Аруан">
      <img src="assets/logo_aurus.png" alt="Аурус">
    </div>
    <span class="title">Прайс-лист оборудования</span>
    <button class="btn-print" onclick="window.print()">Скачать PDF</button>
  </header>

  <!-- FILTER CHIPS -->
  <div class="filter-bar" id="filterBar">
    <button class="chip active" data-cat="">Все <span class="chip-count"></span></button>
  </div>

  <!-- MAIN -->
  <main class="content">

    <!-- PRINT-ONLY HEADER -->
    <div class="print-header">
      <div class="ph-logos">
        <img src="assets/logo_aruan.png" alt="Аруан">
        <img src="assets/logo_aurus.png" alt="Аурус">
      </div>
      <div class="ph-title">
        <h1>Прайс-лист оборудования</h1>
        <p>Аруан &amp; Аурус</p>
      </div>
    </div>

    <table class="price-table" id="priceTable">
      <thead>
        <tr>
          <th class="col-photo">Фото</th>
          <th class="col-name">Наименование</th>
          <th class="col-specs">Характеристики</th>
          <th class="col-price">Цена</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>

  </main>

  <script src="database-equipment-a.js"></script>
  <script src="database-equipment-b.js"></script>
  <script>
    (function () {
      const ALL = [...EQUIPMENT_DB_A, ...EQUIPMENT_DB_B];

      // Sort: by category, then by price asc
      ALL.sort((a, b) => {
        if (a.category < b.category) return -1;
        if (a.category > b.category) return 1;
        return (a.price || 0) - (b.price || 0);
      });

      // Build category map with counts
      const catCounts = {};
      ALL.forEach(item => {
        catCounts[item.category] = (catCounts[item.category] || 0) + 1;
      });
      const categories = Object.keys(catCounts).sort();

      // Format price
      const fmt = new Intl.NumberFormat('ru-RU');
      function formatPrice(p) {
        if (!p && p !== 0) return '-';
        return fmt.format(Math.round(p)) + ' ₽'; // &nbsp;₽
      }

      // Build chips
      const filterBar = document.getElementById('filterBar');
      // Update "Все" count
      filterBar.querySelector('[data-cat=""] .chip-count').textContent = '(' + ALL.length + ')';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.dataset.cat = cat;
        btn.textContent = cat + ' (' + catCounts[cat] + ')';
        filterBar.appendChild(btn);
      });

      // Render rows
      const tbody = document.getElementById('tableBody');

      function renderRows(data) {
        tbody.innerHTML = '';
        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.dataset.cat = item.category;

          // Photo cell
          const tdPhoto = document.createElement('td');
          tdPhoto.className = 'col-photo';
          if (item.img) {
            const img = document.createElement('img');
            img.className = 'item-img';
            img.src = 'images/' + item.img;
            img.alt = item.name;
            img.loading = 'lazy';
            img.onerror = function () {
              const ph = document.createElement('div');
              ph.className = 'img-placeholder';
              ph.textContent = '📷';
              this.parentNode.replaceChild(ph, this);
            };
            tdPhoto.appendChild(img);
          } else {
            const ph = document.createElement('div');
            ph.className = 'img-placeholder';
            ph.textContent = '📷';
            tdPhoto.appendChild(ph);
          }

          // Name cell
          const tdName = document.createElement('td');
          tdName.className = 'col-name';
          const nameDiv = document.createElement('div');
          nameDiv.className = 'item-name';
          nameDiv.textContent = item.name;
          tdName.appendChild(nameDiv);
          const catSpan = document.createElement('span');
          catSpan.className = 'item-category';
          catSpan.textContent = item.category;
          tdName.appendChild(catSpan);

          // Specs cell
          const tdSpecs = document.createElement('td');
          tdSpecs.className = 'col-specs';
          tdSpecs.textContent = item.specs || '';

          // Price cell
          const tdPrice = document.createElement('td');
          tdPrice.className = 'col-price';
          tdPrice.textContent = formatPrice(item.price);

          tr.appendChild(tdPhoto);
          tr.appendChild(tdName);
          tr.appendChild(tdSpecs);
          tr.appendChild(tdPrice);
          tbody.appendChild(tr);
        });
      }

      // Initial render
      renderRows(ALL);

      // Filter logic
      let activeChip = filterBar.querySelector('[data-cat=""]');

      filterBar.addEventListener('click', function (e) {
        const chip = e.target.closest('.chip');
        if (!chip) return;

        activeChip.classList.remove('active');
        chip.classList.add('active');
        activeChip = chip;

        const cat = chip.dataset.cat;
        const filtered = cat ? ALL.filter(i => i.category === cat) : ALL;
        renderRows(filtered);
      });
    })();
  </script>
</body>
</html>
