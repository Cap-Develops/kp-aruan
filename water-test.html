<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стенд разбора анализов — Аруан &amp; Аурус</title>
<!--
  Служебная страница: прогон анализов пачкой, чтобы видеть качество распознавания
  и отмечать ошибки. Распознаёт и разбирает тот же water-pipeline.js, что и боевая
  water.html - иначе стенд показывал бы не то, что увидит менеджер.
  Ссылки из hub.html на неё нет: инструмент для доводки, не для работы.
-->
<style>
@font-face{font-family:'Muller';src:url('fonts/muller-regular.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:'Muller';src:url('fonts/muller-medium.woff2') format('woff2');font-display:swap;font-weight:500}
@font-face{font-family:'Muller';src:url('fonts/muller-bold.woff2') format('woff2');font-display:swap;font-weight:700}
:root{
  --blue:#1565C0; --blue-dark:#0D47A1; --blue-pale:#f0f7ff;
  --accent:#FF6F00; --accent-light:#FFF3E0;
  --text:#1a2332; --text-muted:#64748b; --text-light:#94a3b8; --border:#e2e8f0;
  --bad:#FDECEA; --bad-b:#E53935; --bad-t:#B71C1C;
  --ok:#E8F5E9; --ok-b:#66BB6A; --ok-t:#2E7D32;
  --bg:#F0F4F8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'Muller',system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;display:flex;
       align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:700}
header a{color:var(--blue);text-decoration:none;font-size:14px;font-weight:500}
header a:hover{text-decoration:underline}
.spacer{flex:1}
.wrap{padding:20px 22px;max-width:1500px;margin:0 auto}
button{font:inherit;font-weight:700;border-radius:9px;padding:9px 18px;cursor:pointer;border:1px solid transparent}
.primary{background:var(--blue);color:#fff}
.primary:hover{background:var(--blue-dark)}
.primary:disabled{background:#b9c6d8;cursor:not-allowed}
.ghost{background:#fff;border-color:var(--border);color:var(--text)}
.ghost:hover{border-color:var(--blue);color:var(--blue)}
.ghost:disabled{color:var(--text-light);cursor:not-allowed;border-color:var(--border)}
select{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#fff;
       color:var(--text);font-weight:500}

.drop{background:#fff;border:2px dashed #c7d3e3;border-radius:14px;padding:34px 24px;text-align:center;
      transition:border-color .15s,background .15s}
.drop.over{border-color:var(--blue);background:var(--blue-pale)}
.drop h2{margin:0 0 6px;font-size:18px;font-weight:700}
.drop p{margin:0 0 16px;color:var(--text-muted);font-size:13.5px}
.kbd{background:#eef2f7;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12.5px;
     font-family:ui-monospace,Consolas,monospace}

.status{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:16px 0;
        display:flex;align-items:center;gap:12px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

.run{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:18px;overflow:hidden}
.run>h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;
        display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--text-muted);font-weight:500}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;background:#eef2f7;color:var(--text-muted)}
.badge.claude-sonnet-5{background:var(--ok);color:var(--ok-t)}
.badge.claude-haiku-4-5-20251001{background:var(--accent-light);color:#E65100}
.pane{display:grid;grid-template-columns:minmax(220px,.6fr) 1.4fr;gap:0;align-items:start}
.shots{border-right:1px solid var(--border);max-height:640px;overflow:auto;background:#fafbfd}
.shots img{width:100%;display:block;border-bottom:1px solid var(--border);cursor:zoom-in}
.shots img.big{position:fixed;inset:10px;width:auto;height:auto;max-width:calc(100vw - 20px);
               max-height:calc(100vh - 20px);margin:auto;z-index:50;cursor:zoom-out;
               box-shadow:0 10px 40px rgba(0,0,0,.35);background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);text-align:left;
   padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700}
td{padding:6px 10px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
.num{color:var(--text-light);font-size:12px;width:26px;text-align:right}
.v{font-weight:700;white-space:nowrap}
.unit{color:var(--text-muted);font-size:12.5px;font-weight:400}
.norm{color:var(--text-muted);font-size:13px;white-space:nowrap}
tr.wrong td{background:var(--bad)}
tr.wrong .v{color:var(--bad-t)}
.fix{width:96px;padding:4px 7px;border:1px solid var(--border);border-radius:7px;font:inherit;
     font-size:13px;text-align:right}
.fix:focus{outline:2px solid var(--blue);outline-offset:-1px}
.foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
details{border-top:1px solid var(--border)}
summary{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-muted)}
summary:hover{color:var(--blue)}
pre{margin:0;padding:12px 16px;background:#fbfcfe;border-top:1px solid var(--border);font-size:12px;
    line-height:1.5;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;
    max-height:420px;overflow:auto}
.err{background:var(--bad);color:var(--bad-t);padding:12px 16px;font-size:14px}
.empty{padding:14px 16px;color:var(--text-muted);font-size:14px}
.hide{display:none}   /* ниже .status и .drop: иначе display:flex перебивает скрытие */
@media(max-width:1000px){.pane{grid-template-columns:1fr}.shots{border-right:none;border-bottom:1px solid var(--border);max-height:300px}}
</style>
</head>
<body>
<header>
  <h1>Стенд разбора анализов</h1>
  <span class="meta">служебная страница, менеджерам не видна</span>
  <div class="spacer"></div>
  <select id="mode" title="Какой моделью разбирать">
    <option value="claude-sonnet-5">Как в работе (Sonnet 5)</option>
    <option value="claude-haiku-4-5-20251001">Haiku 4.5, вдвое дешевле</option>
    <option value="compare">Сравнить: Sonnet и Haiku по очереди</option>
  </select>
  <button class="ghost" id="report" disabled>Скачать отчёт</button>
  <a href="water.html">Рабочая страница →</a>
</header>

<div class="wrap">
  <div id="drop" class="drop">
    <h2>Бросьте сюда анализы — можно сразу несколько</h2>
    <p>Перетащите файлы, нажмите <span class="kbd">Ctrl</span>+<span class="kbd">V</span> для вставки
       из буфера или выберите вручную. PDF, скан, фотография, скриншот, Word.</p>
    <button class="primary" id="pick">Выбрать файлы</button>
    <input type="file" id="file" class="hide" accept=".pdf,.docx,image/*" multiple>
  </div>

  <div id="status" class="status hide"><span class="dot"></span><span id="statusText"></span></div>
  <div id="runs"></div>
</div>

<script src="supabase.min.js"></script>
<script src="auth.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="water-pipeline.js"></script>
<script>
(function () {
  'use strict';

  var el = function (id) { return document.getElementById(id); };
  var runs = [];              // накопленные прогоны - из них собирается отчёт
  var queue = [], busy = false;

  var TITLES = { 'claude-sonnet-5': 'Sonnet 5', 'claude-haiku-4-5-20251001': 'Haiku 4.5' };
  // цены за миллион токенов, вход/выход - чтобы показывать стоимость разбора
  var RATES = { 'claude-sonnet-5': [2, 10], 'claude-haiku-4-5': [1, 5], 'GigaChat': [0, 0] };
  var USD = 90;   // курс для прикидки, точность здесь не нужна

  /* ── прогон одного файла одним движком ───────────────── */

  /** Стоимость разбора по фактическому расходу токенов - её видно в шапке карточки. */
  function priceOf(data) {
    var u = data.usage || {};
    var inp = u.input_tokens || u.prompt_tokens || 0;
    var out = u.output_tokens || u.completion_tokens || 0;
    var key = Object.keys(RATES).filter(function (k) {
      return String(data.model || '').indexOf(k) === 0;
    })[0];
    if (!key || !inp) return null;
    var usd = inp * RATES[key][0] / 1e6 + out * RATES[key][1] / 1e6;
    return { usd: usd, rub: usd * USD, inp: inp, out: out };
  }

  async function runOne(file, mode) {
    var t0 = performance.now();
    var read = await window.WaterPipeline.readFile(file, say);
    var tRead = (performance.now() - t0) / 1000;

    var t1 = performance.now();
    var data = await window.WaterPipeline.parse(read, say, mode);
    var tParse = (performance.now() - t1) / 1000;

    return {
      file: file.name || 'из буфера',
      mode: mode,
      kind: read.kind,
      seconds: { read: tRead, parse: tParse },
      price: priceOf(data),
      engine: data.engine || null,
      usedModel: data.model || null,
      lab: data.lab || null,
      date: data.date || null,
      rows: (data.rows || []).map(function (r) {
        return { n: r.n, name: r.name, key: r.key, value: r.value, below: r.below,
                 unit: r.unit, limit: r.limit, variants: r.variants || null,
                 wrong: false, should: '' };
      }),
      passes: read.passes || [],
      previews: read.previews,
    };
  }

  async function handle(files) {
    for (var i = 0; i < files.length; i++) queue.push(files[i]);
    if (busy) return;
    busy = true;
    el('report').disabled = true;

    while (queue.length) {
      var file = queue.shift();
      var chosen = el('mode').value;
      var modes = chosen === 'compare'
        ? ['claude-sonnet-5', 'claude-haiku-4-5-20251001'] : [chosen];

      for (var m = 0; m < modes.length; m++) {
        say('Читаю «' + (file.name || 'из буфера') + '»' +
            (modes.length > 1 ? ' (' + TITLES[modes[m]] + ')' : '') +
            (queue.length ? ', в очереди ещё ' + queue.length : ''));
        try {
          var run = await runOne(file, modes[m]);
          runs.push(run);
          draw(run);
        } catch (e) {
          drawError(file.name || 'из буфера', modes[m], e && e.message ? e.message : String(e));
        }
      }
    }

    busy = false;
    say('');
    el('report').disabled = runs.length === 0;
  }

  function say(text) {
    el('statusText').textContent = text || '';
    el('status').classList.toggle('hide', !text);
  }

  /* ── отрисовка ───────────────────────────────────────── */

  function showValue(row) {
    if (row.value !== null && row.value !== undefined) return String(row.value).replace('.', ',');
    if (row.below !== null && row.below !== undefined) {
      var b = String(row.below).replace('.', ',').trim();
      return /^\d+(?:,\d+)?$/.test(b) ? 'менее ' + b : b;   // как в water-ui.js
    }
    return '—';
  }

  function drawError(name, mode, text) {
    var box = document.createElement('div');
    box.className = 'run';
    var h = document.createElement('h3');
    h.textContent = name;
    var b = document.createElement('span');
    b.className = 'badge';
    b.textContent = TITLES[mode] || mode;
    h.appendChild(b);
    var err = document.createElement('div');
    err.className = 'err';
    err.textContent = 'Не получилось: ' + text;
    box.appendChild(h);
    box.appendChild(err);
    el('runs').insertBefore(box, el('runs').firstChild);
  }

  function draw(run) {
    var box = document.createElement('div');
    box.className = 'run';

    var h = document.createElement('h3');
    h.textContent = run.file;
    var badge = document.createElement('span');
    badge.className = 'badge ' + run.mode;
    badge.textContent = TITLES[run.mode] || run.mode;
    h.appendChild(badge);
    var meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = run.kind + ' · показателей ' + run.rows.length +
                       ' · подготовка ' + run.seconds.read.toFixed(1) + ' с' +
                       ' · разбор ' + run.seconds.parse.toFixed(1) + ' с' +
                       (run.price ? ' · ' + run.price.rub.toFixed(2) + ' ₽ (' +
                         run.price.inp + '/' + run.price.out + ' токенов)' : '') +
                       (run.engine === 'gigachat' ? ' · запасной путь, GigaChat' : '') +
                       (run.lab ? ' · ' + run.lab : '');
    h.appendChild(meta);
    box.appendChild(h);

    var pane = document.createElement('div');
    pane.className = 'pane';

    var shots = document.createElement('div');
    shots.className = 'shots';
    run.previews.forEach(function (src) {
      var img = new Image();
      img.src = src;
      img.onclick = function () { img.classList.toggle('big'); };
      shots.appendChild(img);
    });
    if (!run.previews.length) {
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = 'У документа Word нет страниц для показа.';
      shots.appendChild(none);
    }
    pane.appendChild(shots);

    var right = document.createElement('div');
    if (!run.rows.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Ни одного показателя не разобрано.';
      right.appendChild(empty);
    } else {
      right.appendChild(table(run));
    }
    pane.appendChild(right);
    box.appendChild(pane);

    // сырой текст: когда значение неверное, сразу видно, кто виноват -
    // движок не прочитал или модель не так разложила по колонкам
    (run.passes || []).forEach(function (text, i) {
      var d = document.createElement('details');
      var s = document.createElement('summary');
      s.textContent = 'Текстовый слой документа, вариант ' + (i + 1) + ' из ' + run.passes.length;
      var pre = document.createElement('pre');
      pre.textContent = text || '(пусто)';
      d.appendChild(s);
      d.appendChild(pre);
      box.appendChild(d);
    });

    var foot = document.createElement('div');
    foot.className = 'foot';
    var note = document.createElement('span');
    note.className = 'meta';
    note.textContent = 'Отметьте галочкой строки, где значение неверное, и впишите правильное — ' +
                       'это попадёт в отчёт.';
    foot.appendChild(note);
    box.appendChild(foot);

    el('runs').insertBefore(box, el('runs').firstChild);
  }

  function table(run) {
    var t = document.createElement('table');
    var head = document.createElement('tr');
    ['', 'Показатель', 'Прочитано', 'Норматив', 'Неверно', 'Как правильно'].forEach(function (name) {
      var th = document.createElement('th');
      th.textContent = name;
      head.appendChild(th);
    });
    t.appendChild(head);

    run.rows.forEach(function (row, idx) {
      var tr = document.createElement('tr');

      var tdNum = document.createElement('td');
      tdNum.className = 'num';
      tdNum.textContent = row.n != null ? row.n : (idx + 1);

      var tdName = document.createElement('td');
      tdName.textContent = row.name || '';
      if (row.variants && row.variants.length > 1) {
        var sp = document.createElement('span');
        sp.className = 'meta';
        sp.textContent = ' · варианты: ' + row.variants.join(' / ');
        tdName.appendChild(sp);
      }

      var tdVal = document.createElement('td');
      tdVal.className = 'v';
      tdVal.textContent = showValue(row);
      if (row.unit) {
        var u = document.createElement('span');
        u.className = 'unit';
        u.textContent = ' ' + row.unit;
        tdVal.appendChild(u);
      }

      var tdLim = document.createElement('td');
      tdLim.className = 'norm';
      tdLim.textContent = row.limit === null || row.limit === undefined || row.limit === ''
        ? '—' : String(row.limit).replace(/(\d)\.(?=\d)/g, '$1,');

      var tdFlag = document.createElement('td');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.onchange = function () {
        row.wrong = cb.checked;
        tr.classList.toggle('wrong', cb.checked);
      };
      tdFlag.appendChild(cb);

      var tdFix = document.createElement('td');
      var fix = document.createElement('input');
      fix.className = 'fix';
      fix.placeholder = 'значение';
      fix.oninput = function () {
        row.should = fix.value.trim();
        if (row.should && !cb.checked) { cb.checked = true; row.wrong = true; tr.classList.add('wrong'); }
      };
      tdFix.appendChild(fix);

      [tdNum, tdName, tdVal, tdLim, tdFlag, tdFix].forEach(function (td) { tr.appendChild(td); });
      t.appendChild(tr);
    });
    return t;
  }

  /* ── отчёт ───────────────────────────────────────────── */

  function report() {
    var data = {
      собран: new Date().toISOString(),
      прогонов: runs.length,
      файлы: runs.map(function (r) {
        var wrong = r.rows.filter(function (x) { return x.wrong; });
        return {
          файл: r.file,
          движок: TITLES[r.mode] || r.mode,
          вход: r.kind,
          лаборатория: r.lab,
          секунды: { чтение: +r.seconds.read.toFixed(1), разбор: +r.seconds.parse.toFixed(1) },
          показателей: r.rows.length,
          ошибок: wrong.length,
          ошибки: wrong.map(function (x) {
            return { показатель: x.name, прочитано: showValue(x), единица: x.unit || null,
                     норматив: x.limit, правильно: x.should || null };
          }),
          показатели: r.rows.map(function (x) {
            return { показатель: x.name, значение: x.value, ниже_предела: x.below,
                     единица: x.unit || null, норматив: x.limit };
          }),
          текст_распознавания: r.passes,
        };
      }),
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'разбор-анализов-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ── события ─────────────────────────────────────────── */

  document.addEventListener('DOMContentLoaded', function () {
    el('pick').onclick = function () { el('file').click(); };
    el('file').onchange = function () { if (this.files.length) handle(this.files); this.value = ''; };
    el('report').onclick = report;

    var drop = el('drop');
    ['dragenter', 'dragover'].forEach(function (t) {
      drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer.files && e.dataTransfer.files.length) handle(e.dataTransfer.files);
    });

    document.addEventListener('paste', function (e) {
      var items = (e.clipboardData || {}).items || [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') {
          var f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) handle(files);
    });
  });
})();
</script>
</body>
</html>
