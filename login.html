<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Конструктор КП</title>
<style>
@font-face{font-family:'Muller';src:url('fonts/muller-regular.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:'Muller';src:url('fonts/muller-medium.woff2') format('woff2');font-display:swap;font-weight:500}
@font-face{font-family:'Muller';src:url('fonts/muller-bold.woff2') format('woff2');font-display:swap;font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Muller',sans-serif;background:#F0F4F8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 32px rgba(0,0,0,.10);padding:40px;width:100%;max-width:400px}
.logos{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:32px}
.logos img{height:36px;object-fit:contain}
.title{font-size:20px;font-weight:700;color:#1A2340;text-align:center;margin-bottom:6px}
.subtitle{font-size:13px;color:#888;text-align:center;margin-bottom:28px}
.label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:6px}
.input{width:100%;padding:12px 14px;font-size:15px;font-family:'Muller',sans-serif;border:2px solid #E0E7EF;border-radius:8px;outline:none;transition:border-color .2s;color:#1A2340}
.input:focus{border-color:#1565C0}
.field{margin-bottom:16px}
.error{display:none;font-size:13px;color:#C62828;background:#FFF5F5;border:1px solid #FFCDD2;border-radius:6px;padding:10px 12px;margin-bottom:16px}
.btn{width:100%;padding:13px;background:#1565C0;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;font-family:'Muller',sans-serif;cursor:pointer;transition:background .2s}
.btn:hover{background:#0D47A1}
.btn:disabled{background:#90A4AE;cursor:default}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logos">
    <img src="assets/logo_aruan.png" alt="Аруан">
    <img src="assets/logo_aurus.png" alt="Аурус">
  </div>
  <div class="title">Конструктор КП</div>
  <div class="subtitle">Войдите в свой аккаунт</div>

  <div id="err" class="error"></div>

  <div class="field">
    <label class="label" for="email">Email</label>
    <input class="input" id="email" type="email" placeholder="Введите ваш email" autocomplete="email">
  </div>
  <div class="field">
    <label class="label" for="pass">Пароль</label>
    <input class="input" id="pass" type="password" placeholder="Введите пароль" autocomplete="current-password">
  </div>

  <button class="btn" id="btn" onclick="doLogin()">Войти</button>
</div>

<script src="supabase.min.js"></script>
<script>
var SUPA_URL = 'https://newproject-sb.netlify.app';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjbHp5enp0b3JpcHVscGNwc2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODIyNzMsImV4cCI6MjA5MjM1ODI3M30.rX-WT1WdZiwRakVcUEkcg-_dnWzfU49LvgTNHYgBYQ0';
var _sb = supabase.createClient(SUPA_URL, ANON);

// Если уже авторизован — сразу редирект
_sb.auth.getSession().then(function(r) {
  if (r.data && r.data.session) {
    window.location.replace(sessionStorage.getItem('auth_redirect') || '/hub.html');
  }
});

document.getElementById('pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('pass').focus();
});

function doLogin() {
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('pass').value;
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');

  err.style.display = 'none';
  if (!email || !pass) { showErr('Введите email и пароль'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Вхожу...';

  _sb.auth.signInWithPassword({ email: email, password: pass }).then(function(result) {
    if (result.error) {
      showErr('Неверный email или пароль');
      btn.disabled = false;
      btn.innerHTML = 'Войти';
      return;
    }
    var redirect = sessionStorage.getItem('auth_redirect') || '/hub.html';
    sessionStorage.removeItem('auth_redirect');
    window.location.replace(redirect);
  }).catch(function() {
    showErr('Ошибка соединения. Попробуйте ещё раз.');
    btn.disabled = false;
    btn.innerHTML = 'Войти';
  });
}

function showErr(msg) {
  var err = document.getElementById('err');
  err.textContent = msg;
  err.style.display = 'block';
}
</script>
</body>
</html>
