*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Muller',Arial,sans-serif;background:linear-gradient(180deg,#EEF2F7 0%,#E1E8F0 100%);color:#1a2332;min-height:100vh}
:root{--blue:#1565C0;--blue-dark:#0D47A1;--blue-light:#E3F2FD;--accent:#FF6F00;--muted:#64748b;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);--glass:rgba(255,255,255,.75);--radius:14px}
input,select,button{font-family:inherit;transition:all .2s ease}
input:focus,select:focus{outline:none;border-color:var(--blue)!important;box-shadow:0 0 0 3px rgba(21,101,192,.12)}
button:active{transform:scale(.97)}
.header{background:linear-gradient(135deg,#0a3d8f,#1565C0,#2979d6);padding:16px 28px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(13,71,161,.25);flex-wrap:wrap}
.header-logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.header-logo img{width:34px;height:34px;object-fit:contain}
.header-title{color:#fff;font-weight:800;font-size:18px;letter-spacing:.3px}
.header-sub{color:rgba(255,255,255,.55);font-size:11px;font-weight:400}
.steps{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.step-btn{padding:8px 20px;border-radius:24px;border:1.5px solid transparent;cursor:pointer;font-size:13px;font-weight:500;transition:all .25s ease;backdrop-filter:blur(4px)}
.step-btn.active{background:#fff;color:#0D47A1;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.1);border-color:rgba(255,255,255,.3)}
.step-btn:not(.active){background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.08)}
.step-btn:not(.active):hover{background:rgba(255,255,255,.18);color:#fff}
.step-badge{margin-left:5px;background:linear-gradient(135deg,#FF6F00,#FF8F00);color:#fff;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700}
.container{max-width:1240px;margin:0 auto;padding:24px 20px}
.card{background:var(--glass);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-label{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.form-input{padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;width:100%;background:#fff;transition:all .2s}
.form-input:hover{border-color:#90CAF9}
.btn-primary{padding:13px 34px;border-radius:10px;border:none;background:linear-gradient(135deg,#1565C0,#1E88E5);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(21,101,192,.3);transition:all .2s}
.btn-primary:hover{box-shadow:0 6px 20px rgba(21,101,192,.4);transform:translateY(-1px)}
.btn-accent{padding:13px 38px;border-radius:10px;border:none;background:linear-gradient(135deg,#FF6F00,#FFA000);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(255,111,0,.3);transition:all .2s}
.btn-accent:hover{box-shadow:0 6px 20px rgba(255,111,0,.4);transform:translateY(-1px)}
.btn-outline{padding:13px 30px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 2px 8px rgba(21,101,192,.08)}
.btn-danger{padding:6px 14px;border-radius:8px;border:none;background:#FFF0F0;color:#C62828;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-danger:hover{background:#FFCDD2}
.catalog-grid{display:grid;grid-template-columns:1fr 480px;gap:20px;align-items:start}
.search-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:18px}
.seg-switch{display:inline-flex;background:#EEF2F7;border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg-btn{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.seg-btn.on{background:linear-gradient(135deg,#1565C0,#1E88E5);color:#fff;box-shadow:0 2px 8px rgba(21,101,192,.3)}
.search-input{flex:1;min-width:200px;padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;background:#fff}
.search-select{padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;background:#fff;cursor:pointer}
.eq-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 220px);overflow-y:auto;padding:0 18px 18px;scroll-behavior:smooth}
.eq-item{background:#fff;border-radius:12px;padding:14px 18px;border:1.5px solid var(--border);display:flex;align-items:center;gap:16px;transition:all .2s ease}
.eq-item:hover{border-color:#64B5F6;box-shadow:0 4px 16px rgba(21,101,192,.08);transform:translateY(-1px)}
.eq-item.added{border:2px solid var(--blue);background:#FAFCFF;opacity:.7}
.eq-name{font-size:14px;font-weight:700}
.eq-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 10px;border-radius:6px;font-weight:600;letter-spacing:.2px}
.tag-cat{background:var(--blue-light);color:var(--blue)}
.tag-prod{background:#E8F5E9;color:#2E7D32}
.tag-brand{background:#FFF3E0;color:#E65100}
.eq-specs{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.eq-price{font-size:16px;font-weight:800;color:#1a2332}
.add-btn{width:40px;height:40px;border-radius:10px;border:none;cursor:pointer;font-size:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.add-btn.add{background:linear-gradient(135deg,#1565C0,#1E88E5);color:#fff;box-shadow:0 3px 10px rgba(21,101,192,.25)}
.add-btn.add:hover{box-shadow:0 5px 16px rgba(21,101,192,.35);transform:scale(1.05)}
.add-btn.remove{background:#FFF0F0;color:#C62828}
.add-btn.remove:hover{background:#FFCDD2;transform:scale(1.05)}
.sidebar{position:sticky;top:40px}
.sidebar-header{padding:18px 20px;background:linear-gradient(135deg,#0a3d8f,#1565C0);color:#fff;border-radius:var(--radius) var(--radius) 0 0}
.sidebar-list{}
.sidebar-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;transition:background .15s}

.sidebar-item.drag-over{border-top:2px solid var(--blue);background:#EEF4FF}
.drag-handle{cursor:grab;color:#bbb;font-size:20px;flex-shrink:0;padding:0 2px;user-select:none;line-height:1}
.drag-handle:hover{color:var(--blue)}
.drag-handle:active{cursor:grabbing}
.qty-input{width:58px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:15px;text-align:center}
.price-input{width:95px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:15px;text-align:right}
.sidebar-total{padding:16px 20px;border-top:2px solid var(--border);background:rgba(250,250,250,.8);border-radius:0 0 var(--radius) var(--radius)}

.preview-table td{padding:12px 10px;font-size:13px;border-bottom:1px solid #E8EDF2}

.preview-table tr:hover{background:#EFF6FF}
.history-item{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;cursor:pointer;transition:all .2s ease}
.history-item:hover{background:#EFF6FF;transform:translateX(4px)}
.eq-thumb{width:56px;height:56px;object-fit:contain;border-radius:10px;flex-shrink:0;background:#fff;padding:2px}

  .pdf-req-table td{padding:6px 10px;border:0.5px solid #ccc;font-size:11px}
  .pdf-req-table tr:nth-child(even){background:#EBF5FB}
  .pdf-photo{width:22mm;height:22mm;object-fit:contain}
}

<script>
// ═══ MANAGERS ═══
var MANAGERS=[

  {id:6,name:'Маяков Дмитрий Анатольевич',phone:'8-800-100-39-54',ext:'14',email:'prom14@aruan.ru',photo:'assets/manager_6.png'}
];
function getManager(id){return MANAGERS.find(function(m){return m.id===id;})||MANAGERS[0];}

// ═══ IMAGE HELPER ═══
function _resolveImg(item){
  // Always prefer current DB entry to handle renames; fall back to stored value
  if(typeof EQUIPMENT_DB!=='undefined'){
    var db=EQUIPMENT_DB.find(function(x){return x.id==item.id;});
    if(db&&db.img)return db.img;
  }
  return item.img||'';
}
function _imgurl(v){return v?(String(v).slice(0,5)==='data:'?v:'images/'+v):'';}
function imgSrc(item){return _imgurl(_resolveImg(item));}
function imgTag(item,w,h,cls){
  var img=_resolveImg(item);
  if(!img)return '';
  return '<img src="'+_imgurl(img)+'" style="width:'+w+'px;height:'+h+'px;object-fit:contain'+(cls?';'+cls:'')+'">';
}
// ═══ ФОТО СВОЕЙ ПОЗИЦИИ: убрать однотонный фон + 200×200 прозрачный PNG (в браузере) ═══
function _onCustomPhoto(ev,itemId){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){showToast('Нужен файл изображения');return;}
  showToast('Обработка фото…');
  _processPhoto(f,function(dataUrl){
    var it=state.items.find(function(i){return i.id===itemId;});
    if(it){it.img=dataUrl;render();showToast('✅ Фото добавлено');}
  },function(){showToast('Не удалось обработать фото');});
}
// ── ИИ-удаление фона (ISNet + onnxruntime, самохост в ort/). Фолбэк - простой алгоритм ниже. ──
var _aiSession=null,_aiLoading=null;
function _aiToast(msg){var t=document.getElementById('ai-toast');if(!t){t=document.createElement('div');t.id='ai-toast';t.style.cssText='position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:14px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25)';document.body.appendChild(t);}t.textContent=msg;}
function _aiToastHide(){var t=document.getElementById('ai-toast');if(t)t.remove();}
function _aiLoadScript(){return new Promise(function(res,rej){if(window.ort)return res();var s=document.createElement('script');s.src='ort/ort.all.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function _aiFetchPart(url,onBytes){return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);var reader=r.body.getReader(),chunks=[],got=0;function pump(){return reader.read().then(function(x){if(x.done){var buf=new Uint8Array(got),off=0;chunks.forEach(function(c){buf.set(c,off);off+=c.length;});return buf;}chunks.push(x.value);got+=x.value.length;onBytes(x.value.length);return pump();});}return pump();});}
function _aiGetSession(){
  if(_aiSession)return Promise.resolve(_aiSession);
  if(_aiLoading)return _aiLoading;
  _aiLoading=_aiLoadScript().then(function(){
    ort.env.wasm.wasmPaths=new URL('ort/',location.href).toString();
    if(!self.crossOriginIsolated)ort.env.wasm.numThreads=1;
    var total=178648008,done=0;
    function prog(n){done+=n;_aiToast('Загрузка ИИ-обработчика: '+Math.min(99,Math.round(done/total*100))+'% (только в первый раз)');}
    return Promise.all([_aiFetchPart('ort/isnet.part1',prog),_aiFetchPart('ort/isnet.part2',prog)]);
  }).then(function(parts){
    var model=new Uint8Array(parts[0].length+parts[1].length);
    model.set(parts[0],0);model.set(parts[1],parts[0].length);
    _aiToast('Запуск ИИ-обработчика…');
    var tryGpu=(navigator.gpu?navigator.gpu.requestAdapter().catch(function(){return null;}):Promise.resolve(null));
    return tryGpu.then(function(ad){
      var ep=ad?['webgpu','wasm']:['wasm'];
      return ort.InferenceSession.create(model,{executionProviders:ep});
    });
  }).then(function(s){_aiSession=s;_aiLoading=null;return s;}).catch(function(e){_aiLoading=null;throw e;});
  return _aiLoading;
}
function _aiRemoveBg(img,onDone,onErr){
  _aiGetSession().then(function(session){
    _aiToast('Обработка фото…');
    var S=1024,c=document.createElement('canvas');c.width=S;c.height=S;
    var ctx=c.getContext('2d');ctx.drawImage(img,0,0,S,S);
    var d=ctx.getImageData(0,0,S,S).data;
    var arr=new Float32Array(3*S*S);
    for(var i=0;i<S*S;i++){arr[i]=d[i*4]/255-0.5;arr[S*S+i]=d[i*4+1]/255-0.5;arr[2*S*S+i]=d[i*4+2]/255-0.5;}
    var feeds={};feeds[session.inputNames[0]]=new ort.Tensor('float32',arr,[1,3,S,S]);
    return session.run(feeds).then(function(res){
      var mask=res[session.outputNames[0]].data;
      var mn=Infinity,mx=-Infinity;
      for(var j=0;j<mask.length;j++){if(mask[j]<mn)mn=mask[j];if(mask[j]>mx)mx=mask[j];}
      var rng=(mx-mn)||1;
      var W=img.naturalWidth,H=img.naturalHeight,sc=Math.min(1,480/Math.max(W,H));
      var w=Math.max(1,Math.round(W*sc)),h=Math.max(1,Math.round(H*sc));
      var pc=document.createElement('canvas');pc.width=w;pc.height=h;
      var pctx=pc.getContext('2d');pctx.drawImage(img,0,0,w,h);
      var pd=pctx.getImageData(0,0,w,h),pp=pd.data;
      for(var y=0;y<h;y++)for(var x=0;x<w;x++){
        var mxi=Math.min(S-1,Math.round(x/w*S)),myi=Math.min(S-1,Math.round(y/h*S));
        pp[(y*w+x)*4+3]=Math.round((mask[myi*S+mxi]-mn)/rng*255);
      }
      pctx.putImageData(pd,0,0);

function _processPhotoSimple(file,onDone,onErr){
  var img=new Image();
  img.onload=function(){
    try{
      var W=img.naturalWidth,H=img.naturalHeight,sc=Math.min(1,480/Math.max(W,H));
      var w=Math.max(1,Math.round(W*sc)),h=Math.max(1,Math.round(H*sc));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      var d=ctx.getImageData(0,0,w,h),px=d.data;
      var br=0,bgc=0,bb=0,n=0;
      function edge(x,y){var i=(y*w+x)*4;br+=px[i];bgc+=px[i+1];bb+=px[i+2];n++;}
      for(var x=0;x<w;x++){edge(x,0);edge(x,h-1);}
      for(var y=0;y<h;y++){edge(0,y);edge(w-1,y);}
      br/=n;bgc/=n;bb/=n;
      var TH=42;
      function isBg(i){var dr=px[i]-br,dg=px[i+1]-bgc,db=px[i+2]-bb;return (dr*dr+dg*dg+db*db)<TH*TH;}
      var seen=new Uint8Array(w*h),stack=[];
      function push(x,y){if(x<0||y<0||x>=w||y>=h)return;var p=y*w+x;if(seen[p])return;seen[p]=1;if(isBg(p*4)){px[p*4+3]=0;stack.push(p);}}
      for(var x2=0;x2<w;x2++){push(x2,0);push(x2,h-1);}
      for(var y2=0;y2<h;y2++){push(0,y2);push(w-1,y2);}
      while(stack.length){var p=stack.pop(),cx=p%w,cy=(p-cx)/w;push(cx+1,cy);push(cx-1,cy);push(cx,cy+1);push(cx,cy-1);}
      ctx.putImageData(d,0,0);
      var minX=w,minY=h,maxX=0,maxY=0,any=false;
      for(var yy=0;yy<h;yy++)for(var xx=0;xx<w;xx++){if(px[(yy*w+xx)*4+3]>10){any=true;if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;}}
      if(!any){minX=0;minY=0;maxX=w-1;maxY=h-1;}
      var cw=maxX-minX+1,ch=maxY-minY+1;
      var out=document.createElement('canvas');out.width=200;out.height=200;
      var octx=out.getContext('2d');
      var s2=Math.min(184/cw,184/ch),dw=Math.round(cw*s2),dh=Math.round(ch*s2);
      octx.drawImage(c,minX,minY,cw,ch,(200-dw)/2,(200-dh)/2,dw,dh);
      onDone(out.toDataURL('image/png'));
    }catch(e){if(onErr)onErr(e);}
  };
  img.onerror=function(){if(onErr)onErr();};
  img.src=URL.createObjectURL(file);
}

// ═══ JS PAGINATION (Stripe/QuickBooks approach) ═══
function paginateTable(){
  var mount=document.getElementById('pdfTableMount');
  if(!mount)return;
  var rowsArr=JSON.parse(mount.getAttribute('data-rows'));
  var headerRow=mount.getAttribute('data-header').replace(/&#39;/g,"'");
  var introHtml=mount.getAttribute('data-intro').replace(/&#39;/g,"'");
  var signHtml=mount.getAttribute('data-sign').replace(/&#39;/g,"'");

  // Page geometry in CSS pixels (96dpi: 1mm ≈ 3.7795px)
  var mm=3.7795;
  var PAGE_H=297*mm;          // A4 height
  var PAGE_W=210*mm;          // A4 width
  var HEADER_BAR_H=16*mm;     // pdf-header-bar (logos in white box)
  var SIDE_PAD=8*mm;          // left/right padding for content
  var TOP_PAD=3*mm;
  var BOT_PAD=12*mm;          // safety bottom margin (extra for print metrics drift)
  var SAFETY=6*mm;

  // Measure each row in a hidden container at exact print width
  var measurer=document.createElement('div');
  measurer.style.cssText='position:absolute;left:-99999px;top:0;width:'+(PAGE_W-2*SIDE_PAD)+'px;font-family:Muller,Arial,sans-serif;visibility:hidden;font-size:13px';
  document.body.appendChild(measurer);

  // Measure header
  measurer.innerHTML='<div style="border:0.5px solid #ccc">'+headerRow+'</div>';
  var headerH=measurer.firstChild.getBoundingClientRect().height;

  // Measure intro
  measurer.innerHTML=introHtml;
  var introH=measurer.firstChild.getBoundingClientRect().height;

  // Measure signature — stamp is 50mm + text + total box + margins ≈ 75-85mm guaranteed
  measurer.innerHTML=signHtml;
  var signH=Math.max(measurer.firstChild.getBoundingClientRect().height,75*mm);

  // Measure each row
  var rowHeights=[];
  for(var i=0;i<rowsArr.length;i++){
    measurer.innerHTML='<div style="border:0.5px solid #ccc">'+rowsArr[i]+'</div>';
    rowHeights.push(measurer.firstChild.getBoundingClientRect().height);
  }
  document.body.removeChild(measurer);

  // Available content height per page (after header bar + paddings)
  var avail=PAGE_H-HEADER_BAR_H-TOP_PAD-BOT_PAD-SAFETY;
  // First page has intro + table header
  var firstAvail=avail-introH-headerH;
  // Other pages have only table header
  var restAvail=avail-headerH;

  // PASS 1: Pack rows greedily (max per page, ignore signature for now)
  var pages=[];var cur=[];var used=0;var isFirst=true;
  for(var ri=0;ri<rowsArr.length;ri++){
    var rh=rowHeights[ri];
    var cap=isFirst?firstAvail:restAvail;
    if(used+rh<=cap){
      cur.push(ri);used+=rh;
    }else{
      pages.push(cur);
      cur=[ri];used=rh;isFirst=false;
    }
  }
  if(cur.length>0)pages.push(cur);

  // PASS 2: Check if signature fits on the LAST page after the last row
  var lastPage=pages[pages.length-1];
  var lastUsed=0;
  for(var li=0;li<lastPage.length;li++)lastUsed+=rowHeights[lastPage[li]];
  var lastCap=(pages.length===1?firstAvail:restAvail);
  var sigGap=4*mm;
  var sigOnLastPage=(lastUsed+sigGap+signH<=lastCap);

  // PASS 3: If signature doesn't fit, try to pull rows from last page back to make room
  // Only if it's a single page or if pulling gives us more space
  if(!sigOnLastPage&&pages.length>1){
    // Move rows from end of last page to a new "signature page" until last page has just 1-2 rows + signature
    // Better approach: leave last page as-is, signature goes on its own page (acceptable last resort)
  }

  // Build the new HTML: one .pdf-page per page, with header bar, intro (only first), table, signature (only last)
  var newHtml='';
  pages.forEach(function(pg,pi){
    var isFirstPg=(pi===0);
    var isLastPg=(pi===pages.length-1);
    newHtml+='<div class="pdf-page pdf-table-page" style="position:relative;padding:0;overflow:visible;background:#fff">';
    newHtml+='<div class="pdf-header-bar"><div style="background:#fff;border-radius:6px;padding:2mm 4mm;display:flex;align-items:center;gap:4mm"><img src="assets/logo_aruan.png" style="height:10mm"><img src="assets/logo_aurus.png" style="height:10mm"></div><div style="display:flex;align-items:center;gap:6mm;font-size:11px"><span>📞 8-800-100-39-54</span><span>✉ prom10@aruan.ru</span><span>🌐 www.filtr-aruan.ru</span></div></div>';
    newHtml+='<div style="padding:'+(TOP_PAD/mm)+'mm '+(SIDE_PAD/mm)+'mm 0">';
    if(isFirstPg)newHtml+=introHtml;
    newHtml+='<div style="border:0.5px solid #ccc;font-size:13px;margin-top:2mm">'+headerRow;
    pg.forEach(function(ri){newHtml+=rowsArr[ri];});
    newHtml+='</div>';
    if(isLastPg&&sigOnLastPage)newHtml+=signHtml;
    newHtml+='</div></div>';
  });
  // If signature didn't fit on last page, add a separate page for it
  if(!sigOnLastPage){
    newHtml+='<div class="pdf-page pdf-table-page" style="position:relative;padding:0;overflow:visible;background:#fff">';
    newHtml+='<div class="pdf-header-bar"><div style="background:#fff;border-radius:6px;padding:2mm 4mm;display:flex;align-items:center;gap:4mm"><img src="assets/logo_aruan.png" style="height:10mm"><img src="assets/logo_aurus.png" style="height:10mm"></div><div style="display:flex;align-items:center;gap:6mm;font-size:11px"><span>📞 8-800-100-39-54</span><span>✉ prom10@aruan.ru</span><span>🌐 www.filtr-aruan.ru</span></div></div>';
    newHtml+='<div style="padding:'+(TOP_PAD/mm)+'mm '+(SIDE_PAD/mm)+'mm 0">'+signHtml+'</div></div>';
  }

  // Replace mount with the paginated content
  mount.outerHTML=newHtml;
}

function addCustomItem(){var id=-(Date.now());state.items.push({id:id,name:'Новая позиция',specs:'',unit:'шт.',price:0,customPrice:0,quantity:1,img:null,category:'',brand:''});render();var sl=document.querySelector('.sidebar-list');if(sl)sl.scrollTop=sl.scrollHeight;}

function _dDrop(e,idx){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(_dragIdx===null||_dragIdx===idx)return;var a=state.items;var item=a.splice(_dragIdx,1)[0];a.splice(idx,0,item);_dragIdx=null;render();}

function editSpecs(id,val){var it=state.items.find(function(i){return i.id===id;});if(it)it.specs=val.split('\n').filter(function(x){return x.trim();}).map(function(x){return x.replace(/\.$/,'');}).join('. ')+'.';}
function removeItem(id){state.items=state.items.filter(function(i){return i.id!==id;});render();}

function updatePrice(id,v){var it=state.items.find(function(i){return i.id===id;});if(it)it.customPrice=v;}

function moveItem(idx,dir){var a=state.items;var n=idx+dir;if(n<0||n>=a.length)return;var t=a[idx];a[idx]=a[n];a[n]=t;render();}
